[project]
name = "n-queens-solver"
version = "0.1.0"
description = "N-Queens SAT Solver with PySAT - compares encoding methods and solvers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-sat>=0.1.9",
    "ortools>=9.10",
    "docplex>=2.25",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "jinja2>=3.1.6",
]

[project.scripts]
nqueens = "n_queens_solver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n_queens_solver"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
